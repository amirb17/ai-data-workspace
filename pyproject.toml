[project]
name = "ai-data-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amir Bensekar", email = "aamirbensekar325@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "authlib>=1.6,<2",
    "boto3>=1.43.77",
    "duckdb>=1.4,<2",
    "email-validator>=2.3,<3",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.46,<4",
    "google-genai>=2.26.0",
    "itsdangerous>=2.2,<3",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pytz>=2026.5",
    "sqlglot>=28,<31",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
ai-data-workspace = "ai_data_workspace:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
