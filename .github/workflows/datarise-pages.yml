name: DataRise public showcase
on:
  push:
    branches: [feature/datarise-public-beta]
    paths:
      - 'showcase/**'
      - '.github/workflows/datarise-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: datarise-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: showcase
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
