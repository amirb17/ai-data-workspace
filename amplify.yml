version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - test -n "$VITE_API_BASE_URL" || (echo "VITE_API_BASE_URL must be configured as the HTTPS backend origin" && exit 1)
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
