version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - if [ -z "$VITE_API_BASE_URL" ]; then export VITE_STATIC_PREVIEW=true; echo "No API origin configured; building read-only frontend preview with backend calls disabled"; fi
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
